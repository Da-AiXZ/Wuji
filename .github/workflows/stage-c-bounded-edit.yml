name: Stage C Bounded Edit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-c-validation:
    name: Apple build, Stage C tests, real iSH, and real DeepSeek edit
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Check out exact candidate without recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fail closed unless existing DeepSeek secrets are configured
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$DEEPSEEK_BASE_URL"
          test -n "$DEEPSEEK_MODEL"
          test -n "$DEEPSEEK_API_KEY"
          echo 'STAGE_C_SECRET_PREFLIGHT=PASS'

      - name: Verify exact head and fixed source closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git submodule update --init ThirdParty/ish
          git -C ThirdParty/ish submodule update --init deps/libarchive
          Scripts/verify-source-lock.sh
          Scripts/verify-minizip-lock.sh
          test "$(git ls-tree HEAD ThirdParty/ish | awk '{print $3}')" = de124dd66124a15239cea1465164f74980ada245
          test "$(git rev-parse 5529dbcc5ac6f01e121db45f082f4d6a5378e325^{tree})" = 865f80fc5d74770da9514ff8f4df982de783b36c

      - name: Install fixed-source build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify rootfs and build fixed iSH static closure
        shell: bash
        run: |
          set -euo pipefail
          Scripts/fetch-rootfs.sh
          Scripts/build-ish.sh "$RUNNER_TEMP/wuji-ish"

      - name: Verify Apple toolchain and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project Wuji.xcodeproj

      - name: Build exact-head unsigned ARM64 app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/wuji-stage-c-derived" \
            clean build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-stage-c-build.log"

      - name: Select and boot an ARM64 iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          simulator_id="$({ xcrun simctl list devices available -j; } | /usr/bin/python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[x for g in d.values() for x in g if x.get("isAvailable") and "iPad" in x.get("name","")]; print(a[0]["udid"] if a else "")')"
          test -n "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run Provider, secure configuration, Stage B, Stage C, and real iSH tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-stage-c-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-stage-c-tests.xcresult" \
            -only-testing:"WujiTests/WujiProviderTests" \
            -only-testing:"WujiTests/WujiStageASecureConfigurationTests" \
            -only-testing:"WujiTests/WujiStageBTests" \
            -only-testing:"WujiTests/WujiStageBISHIntegrationTests" \
            -only-testing:"WujiTests/WujiStageCContractsTests" \
            -only-testing:"WujiTests/WujiStageCStoreApprovalTests" \
            -only-testing:"WujiTests/WujiStageCAgentTests" \
            -only-testing:"WujiTests/WujiStageCApprovalViewTests" \
            -only-testing:"WujiTests/WujiStageCISHIntegrationTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            2>&1 | tee "$RUNNER_TEMP/wuji-stage-c-tests.log"

      - name: Audit focused XCTest names and results
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/wuji-stage-c-tests.xcresult" --format json \
            > "$RUNNER_TEMP/wuji-stage-c-summary.json"
          xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/wuji-stage-c-tests.xcresult" --format json \
            > "$RUNNER_TEMP/wuji-stage-c-tests.json"
          RUNNER_TEMP="$RUNNER_TEMP" /usr/bin/python3 <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          summary = json.loads((root / "wuji-stage-c-summary.json").read_text())
          if summary.get("failedTests", 0) != 0 or summary.get("skippedTests", 0) != 0:
              raise SystemExit("Stage C XCTest summary contains failure or skip")
          text = (root / "wuji-stage-c-tests.json").read_text()
          required = [
              "testProductionDefaultsAreExactInjectableImplementationValues",
              "testProposalComputesBoundedDiffAndExpectedTreeWithoutMutation",
              "testContextChunksRulesAndProvesWireBodyBeforeProviderIO",
              "testEditMustBeSingleAndCannotMixWithReadBatch",
              "testUnknownWriteShellNetworkGitCreateRenameDeleteAndOverwriteFailClosed",
              "testParentAbsoluteOtherTargetMarkerGitAndSymlinkAreRejected",
              "testPostWriteVerifierRejectsAnyAdditionalWorkspaceChange",
              "testApprovalBindsEveryTaskWorkspaceSessionGoalRuleAndProposalFact",
              "testExpiredWrongNonceAndBindingDriftFailClosed",
              "testDurableStoreRejectsOversizedProposalAndKeepsBoundedNecessaryFacts",
              "testSameWorkspaceWriterGateIsStrictlySerial",
              "testOrphanMutationIntentColdSnapshotCannotBecomeSuccess",
              "testApprovedEditPersistsIntentBeforeWriteAndCompletesOnlyAfterVerifierAndProviderFinish",
              "testRejectedApprovalPerformsZeroWriteIO",
              "testUnknownWriteColdReopenNeverResendsMutation",
              "testMixedEditAndReadGetsOriginalIDFeedbackAndZeroExecutorIOBeforeCorrection",
              "testCompletedColdReopenCreatesZeroProviderAndExecutorAttempts",
              "testPendingApprovalColdReopenRequiresNewNonceAndExplicitReconfirmation",
              "testReliableMutationSuccessColdReopenVerifiesWithoutRepeatingWrite",
              "testCompletedProjectionWithoutDurableClosureReconcilesWithZeroIO",
              "testReliableProviderTerminalWithoutTypedOutcomeReconcilesWithZeroRetry",
              "testReliableCompletionCheckWithoutFinalRecordReconcilesWithoutRepeatingIO",
              "testApprovalBrokerProjectsPendingAndApproveWithoutFileIO",
              "testApprovalBrokerProjectsRejectAndCancelWithoutChangingExecutionTruth",
              "testReadingDurableProjectionCannotCreateCompletionOrMutationAttempt",
              "testRealISHExecutesTypedBoundedEditOnStageAImportedWorkspace",
          ]
          missing = [name for name in required if name not in text]
          if missing:
              raise SystemExit("missing Stage C required XCTest names: " + ", ".join(missing))
          print(f"STAGE_C_REQUIRED_XCTEST_CASES={len(required)}")
          print("STAGE_C_XCRESULT_AUDIT=PASS")
          PY

      - name: Install exact-head app and verify Stage C fixture resources
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/wuji-stage-c-derived/Build/Products/Debug-iphonesimulator/Wuji.app"
          test -d "$app/StageCRealImportedProject"
          test -f "$app/StageCRealImportedProject/AGENTS.md"
          test -f "$app/StageCRealImportedProject/Sources/AGENTS.md"
          test -f "$app/StageCRealImportedProject/Sources/Configuration/AppProfile.txt"
          test -f "$app/rootfs.tar.gz"
          xcrun simctl uninstall "${{ steps.simulator.outputs.id }}" com.daaixz.wuji >/dev/null 2>&1 || true
          xcrun simctl install "${{ steps.simulator.outputs.id }}" "$app"

      - name: Run production Stage A to B to C loop with real DeepSeek and iSH
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_STAGE_C_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          set +x
          simulator_id="$WUJI_STAGE_C_SIMULATOR_ID"
          data_container="$(xcrun simctl get_app_container "$simulator_id" com.daaixz.wuji data)"
          summary_file="$data_container/Documents/wuji-stage-c-summary.json"
          rm -f "$summary_file"
          export SIMCTL_CHILD_WUJI_STAGE_C_PROBE_MODE=1
          export SIMCTL_CHILD_WUJI_STAGE_C_SUMMARY_FILE="$summary_file"
          export SIMCTL_CHILD_DEEPSEEK_BASE_URL="$DEEPSEEK_BASE_URL"
          export SIMCTL_CHILD_DEEPSEEK_MODEL="$DEEPSEEK_MODEL"
          export SIMCTL_CHILD_DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
          xcrun simctl launch --terminate-running-process "$simulator_id" com.daaixz.wuji \
            > "$RUNNER_TEMP/wuji-stage-c-launch.log" 2>&1
          unset SIMCTL_CHILD_WUJI_STAGE_C_PROBE_MODE SIMCTL_CHILD_WUJI_STAGE_C_SUMMARY_FILE
          unset SIMCTL_CHILD_DEEPSEEK_BASE_URL SIMCTL_CHILD_DEEPSEEK_MODEL SIMCTL_CHILD_DEEPSEEK_API_KEY
          ps ax -o command= > "$RUNNER_TEMP/wuji-stage-c-process-args.txt"
          for _ in $(seq 1 360); do
            [[ -f "$summary_file" ]] && break
            sleep 2
          done
          xcrun simctl terminate "$simulator_id" com.daaixz.wuji >/dev/null 2>&1 || true
          test -f "$summary_file"
          export WUJI_STAGE_C_DATA_CONTAINER="$data_container"
          export WUJI_STAGE_C_SUMMARY_FILE="$summary_file"
          /usr/bin/python3 <<'PY'
          import json, os, pathlib, re
          data = pathlib.Path(os.environ["WUJI_STAGE_C_DATA_CONTAINER"])
          summary = json.loads(pathlib.Path(os.environ["WUJI_STAGE_C_SUMMARY_FILE"]).read_text())
          expected = {
              "result_category", "import_id", "session_id", "task_id",
              "workspace_identity_sha256", "goal_binding_sha256", "rule_set_binding_sha256",
              "rule_sources", "relative_path", "before_sha256", "after_sha256",
              "proposal_sha256", "diff_sha256", "final_tree_sha256", "approval_state",
              "external_attempt_count_before_cold_restore",
              "external_attempt_count_after_cold_restore", "cold_restore_category",
          }
          if set(summary) != expected or summary["result_category"] != "completed":
              print("STAGE_C_REAL_LOOP_FAILURE=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
              raise SystemExit("real Stage C loop did not complete")
          if summary["relative_path"] != "Sources/Configuration/AppProfile.txt":
              raise SystemExit("unexpected Stage C target")
          if summary["rule_sources"] != ["AGENTS.md", "Sources/AGENTS.md"]:
              raise SystemExit("Stage C rule discovery mismatch")
          if summary["approval_state"] != "consumed" or summary["cold_restore_category"] != "durable_completed":
              raise SystemExit("Stage C approval/recovery category mismatch")
          if summary["external_attempt_count_before_cold_restore"] != summary["external_attempt_count_after_cold_restore"]:
              raise SystemExit("Stage C cold restore repeated external I/O")
          for key in [k for k in summary if k.endswith("sha256")]:
              if not re.fullmatch(r"[0-9a-f]{64}", summary[key]):
                  raise SystemExit("invalid Stage C evidence hash")
          support = data / "Library" / "Application Support"
          imports = list((support / "WujiStageA" / "ImportRecords").glob("*.json"))
          workspaces = [p for p in (support / "WujiStageA" / "Workspaces").iterdir() if p.is_dir()]
          sessions = list((support / "WujiStageB" / "Sessions").glob("*/session.json"))
          tasks = list((support / "WujiStageC" / "Tasks").glob("*.json"))
          if not (len(imports) == len(workspaces) == len(sessions) == len(tasks) == 1):
              raise SystemExit("Stage C truth identity is not unique")
          workspace = workspaces[0]
          target = workspace / "Sources/Configuration/AppProfile.txt"
          if target.read_text() != "application_name = Wuji\nrelease_channel = stable\ntelemetry_mode = bounded\n":
              raise SystemExit("Stage C target after-state mismatch")
          if (workspace / "Sources/Configuration/FeatureFlags.txt").read_text() != "stage_c_fixture = enabled\n":
              raise SystemExit("Stage C unrelated file changed")
          task = json.loads(tasks[0].read_text())
          if task["phase"] != "completed" or task["id"].lower() != summary["task_id"]:
              raise SystemExit("Stage C durable task mismatch")
          if task["workspaceIdentitySHA256"] != summary["workspace_identity_sha256"]:
              raise SystemExit("Stage C workspace binding mismatch")
          if not any(x["state"] == "consumed" for x in task["approvals"]):
              raise SystemExit("Stage C consumed approval missing")
          attempts = task["attempts"]
          operations = {}
          for item in attempts:
              operations.setdefault(item["attemptID"], []).append(item)
          if any([x["phase"] for x in pair] != ["intent_recorded", "succeeded"] for pair in operations.values()):
              raise SystemExit("Stage C external intent/terminal order invalid")
          durable = json.dumps(task, sort_keys=True)
          for forbidden in ["Root Stage C test rules", "application_name = Wuji", "telemetry_mode = bounded"]:
              if forbidden in durable:
                  raise SystemExit("Stage C durable evidence copied full rule/source")
          print("STAGE_C_REAL_LOOP_SUMMARY=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("STAGE_C_READY_WORKSPACE_BINDING=PASS")
          print("STAGE_C_DURABLE_INTENT_AUDIT=PASS")
          print("STAGE_C_APPROVAL_BINDING_AUDIT=PASS")
          print("STAGE_C_POST_WRITE_VERIFIER=PASS")
          print("STAGE_C_COLD_RESTORE_NO_RETRY=PASS")
          print("STAGE_C_REAL_ISH_DEEPSEEK_EDIT=PASS")
          PY

      - name: Scan exact secret across retained Stage C surfaces
        if: always()
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_STAGE_C_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          set +x
          data_container="$(xcrun simctl get_app_container "$WUJI_STAGE_C_SIMULATOR_ID" com.daaixz.wuji data 2>/dev/null || true)"
          export WUJI_STAGE_C_DATA_CONTAINER="$data_container"
          /usr/bin/python3 <<'PY'
          import os, pathlib
          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if not secret:
              raise SystemExit("Stage C secret unavailable")
          roots = [pathlib.Path("."), pathlib.Path(os.environ["RUNNER_TEMP"])]
          data = os.environ.get("WUJI_STAGE_C_DATA_CONTAINER")
          if data:
              roots.append(pathlib.Path(data))
          inspected = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if path.is_file():
                      inspected += 1
                      try:
                          if secret in path.read_bytes():
                              raise SystemExit(f"exact secret found in retained Stage C surface: {path}")
                      except OSError:
                          pass
          if inspected == 0:
              raise SystemExit("Stage C secret scan inspected no files")
          print(f"STAGE_C_SECRET_SCAN_FILES={inspected}")
          print("STAGE_C_RETAINED_SECRET_SCAN=PASS")
          PY

      - name: Audit Stage C scope, forbidden capabilities, and protected history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          import pathlib, re, subprocess
          baseline = "5529dbcc5ac6f01e121db45f082f4d6a5378e325"
          changed = subprocess.check_output(["git", "diff", "--name-only", baseline + "..HEAD"], text=True).splitlines()
          allowed = re.compile(r"^(?:Wuji\.xcodeproj/project\.pbxproj|Executor/WujiISHAdapter\.[ch]|Wuji/(?:WujiApp|StageBView|StageC[^/]*)\.swift|Wuji/StageCRealImportedProject/.*|WujiTests/WujiStageC.*Tests\.swift|\.github/workflows/stage-c-bounded-edit\.yml|docs/PROJECT_CONTROL_CENTER\.md)$")
          unexpected = [p for p in changed if not allowed.fullmatch(p)]
          if unexpected:
              raise SystemExit("Stage C scope escaped: " + ", ".join(unexpected))
          swift = "\n".join(path.read_text() for path in pathlib.Path("Wuji").glob("StageC*.swift"))
          for forbidden in ["command: String", "URLSession.shared", "Process(", "NSTask", "import Network", "package install"]:
              if forbidden in swift:
                  raise SystemExit("forbidden generic Stage C capability: " + forbidden)
          adapter = pathlib.Path("Executor/WujiISHAdapter.c").read_text()
          start = adapter.index("static const char stage_c_edit_script")
          end = adapter.index("static const char s4_edit_script")
          body = adapter[start:end]
          for forbidden in ["/bin/curl", "/bin/wget", "/usr/bin/git", "apk add", "apt-get"]:
              if forbidden in body:
                  raise SystemExit("forbidden Stage C executor capability")
          for required in ["wuji_ish_run_stage_c_edit", "WUJI_STAGE_C_EDIT_OK", "before_sha256", "expectedAfterTreeSHA256"]:
              if required not in adapter + swift:
                  raise SystemExit("required Stage C boundary missing: " + required)
          print("STAGE_C_SCOPE_AUDIT=PASS")
          print("STAGE_C_FORBIDDEN_CAPABILITY_SCAN=PASS")
          PY
          git diff --quiet 5529dbcc5ac6f01e121db45f082f4d6a5378e325..HEAD -- \
            AGENTS.md docs/IMPLEMENTATION_PLAN.md ThirdParty/ish ThirdParty/minizip-ng \
            Wuji/StageAImportContracts.swift Wuji/StageAWorkspaceStore.swift \
            Wuji/StageAWorkspaceImporter.swift Wuji/StageBContracts.swift \
            Wuji/StageBSessionStore.swift Wuji/StageBReadOnlyPolicy.swift \
            Wuji/ISHStageBReadOnlyExecutor.swift Wuji/StageBReadOnlyAgent.swift \
            Wuji/StageBRealImportedProject Wuji/S3Fixture Wuji/S4Fixture \
            WujiTests/WujiStageAImportTests.swift WujiTests/WujiStageBTests.swift \
            WujiTests/WujiStageBISHIntegrationTests.swift \
            .github/workflows/s0-apple-build.yml .github/workflows/s1-ish-executor.yml \
            .github/workflows/s2-provider.yml .github/workflows/s3-read-only-agent.yml \
            .github/workflows/s4-modification-agent.yml \
            .github/workflows/stage-a-production-entry.yml \
            .github/workflows/stage-b-read-only-session.yml
          echo 'STAGE_C_PROTECTED_HISTORY_UNCHANGED=PASS'

  raw-log-audit:
    name: Exact Stage C raw-log and artifact audit
    if: always()
    needs: stage-c-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download completed Stage C validation raw log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.name | endswith("Apple build, Stage C tests, real iSH, and real DeepSeek edit")) | .id')"
          test -n "$job_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/stage-c-validation.log"

      - name: Scan raw log for exact secret and required success markers
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          STAGE_C_MAIN_RESULT: ${{ needs.stage-c-validation.result }}
        run: |
          set -euo pipefail
          set +x
          export STAGE_C_RAW_LOG="$RUNNER_TEMP/stage-c-validation.log"
          /usr/bin/python3 <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ["STAGE_C_RAW_LOG"]).read_bytes()
          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if secret in log:
              raise SystemExit("exact secret found in Stage C raw log")
          if os.environ["STAGE_C_MAIN_RESULT"] == "success":
              for marker in [
                  b"STAGE_C_XCRESULT_AUDIT=PASS",
                  b"STAGE_C_REAL_ISH_DEEPSEEK_EDIT=PASS",
                  b"STAGE_C_DURABLE_INTENT_AUDIT=PASS",
                  b"STAGE_C_POST_WRITE_VERIFIER=PASS",
                  b"STAGE_C_RETAINED_SECRET_SCAN=PASS",
                  b"STAGE_C_FORBIDDEN_CAPABILITY_SCAN=PASS",
                  b"STAGE_C_PROTECTED_HISTORY_UNCHANGED=PASS",
              ]:
                  if marker not in log:
                      raise SystemExit("required Stage C raw-log marker missing")
          print("STAGE_C_RAW_LOG_SECRET_SCAN=PASS")
          PY

      - name: Confirm this run published no artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')" = 0
          echo 'STAGE_C_ARTIFACT_COUNT=0'
