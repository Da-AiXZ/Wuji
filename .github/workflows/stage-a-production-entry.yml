name: Stage A Production Entry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  stage-a-validation:
    name: Apple build, Files import, ZIP policy, and Keychain tests
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate without recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Verify exact head and approved source locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git submodule update --init ThirdParty/ish
          git -C ThirdParty/ish submodule update --init deps/libarchive
          Scripts/verify-source-lock.sh
          Scripts/verify-minizip-lock.sh
          test -f ThirdParty/minizip-ng/LICENSE
          test "$(git rev-parse d57ff0a1c0c5a3a749d35910c55dc6c495f657aa^{tree})" = \
            "6864f865c0d32a242877c6b28e5bfbb9f736f4ba"

      - name: Install fixed-source build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify rootfs before any use
        shell: bash
        run: Scripts/fetch-rootfs.sh

      - name: Build fixed iSH static closure
        shell: bash
        run: Scripts/build-ish.sh "$RUNNER_TEMP/wuji-ish"

      - name: Build minimal Stage A ZIP closure
        shell: bash
        run: Scripts/build-stage-a-zip.sh "$RUNNER_TEMP/wuji-stage-a-zip"

      - name: Verify Apple toolchain and Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -list -project Wuji.xcodeproj

      - name: Build exact-head unsigned ARM64 Wuji app
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/wuji-stage-a-derived" \
            clean build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-stage-a-build.log"

      - name: Select and boot an ARM64 iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          simulator_id="$({ xcrun simctl list devices available -j; } | /usr/bin/python3 -c 'import json, sys; groups = json.load(sys.stdin)["devices"]; devices = [device for group in groups.values() for device in group if device.get("isAvailable") and "iPad" in device.get("name", "")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run focused Stage A Files, ZIP, recovery, and Keychain tests
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-stage-a-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-stage-a-tests.xcresult" \
            -only-testing:"WujiTests/WujiStageAImportTests" \
            -only-testing:"WujiTests/WujiStageASecureConfigurationTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-stage-a-tests.log"

      - name: Audit focused XCTest results
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary \
            --path "$RUNNER_TEMP/wuji-stage-a-tests.xcresult" --format json \
            > "$RUNNER_TEMP/wuji-stage-a-summary.json"
          xcrun xcresulttool get test-results tests \
            --path "$RUNNER_TEMP/wuji-stage-a-tests.xcresult" --format json \
            > "$RUNNER_TEMP/wuji-stage-a-tests.json"
          /usr/bin/python3 - "$RUNNER_TEMP/wuji-stage-a-tests.json" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          serialized = json.dumps(payload, sort_keys=True)
          expected = [
              "testProductionDefaultsRemainExact",
              "testNamedFolderAndZIPFixturesPublishDistinctAppOwnedWorkspaces",
              "testPathTraversalAbsoluteCollisionParentAndLimitsRejectBeforeReady",
              "testZIPEntryPolicyRejectsEncryptionCompressionLinksSpecialAndAmbiguity",
              "testExistingDestinationIsNeverOverwritten",
              "testTraversalZIPFailsBeforeWorkspaceBecomesReady",
              "testCancellationLeavesNoReadyWorkspace",
              "testAmbiguousFileAndFolderLinkRejectBeforeReady",
              "testContainedURLRejectsBoundaryEscape",
              "testPublishedUnknownReconcilesFromDurableMarkerWithoutRepeatingImport",
              "testRealKeychainRoundTripUsesDataItemAndDeletesIt",
              "testConfigurationReachesReplaceableProviderWithoutPersistingSecret",
              "testFailedKeychainWriteLeavesConfigurationPendingAndUnavailable",
              "testInvalidBaseURLAndModelRejectBeforeSecretPersistence",
              "testExactNegativeScanSentinelUsesKeychainAndLeavesNoPersistentSecret",
          ]
          missing = [name for name in expected if name not in serialized]
          if missing:
              raise SystemExit("missing Stage A XCTest evidence: " + ", ".join(missing))
          print(f"STAGE_A_XCTEST_CASES={len(expected)}")
          print("STAGE_A_XCRESULT_AUDIT=PASS")
          PY

      - name: Scan exact Stage A secret across every retained surface
        shell: bash
        run: |
          set -euo pipefail
          set +x
          app_data="$(xcrun simctl get_app_container '${{ steps.simulator.outputs.id }}' com.daaixz.wuji data)"
          process_snapshot="$RUNNER_TEMP/wuji-stage-a-process-args.txt"
          ps ax -o command= > "$process_snapshot"
          export WUJI_STAGE_A_APP_DATA="$app_data"
          export WUJI_STAGE_A_PROCESS_SNAPSHOT="$process_snapshot"
          /usr/bin/python3 <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          runner_temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          secret = hashlib.sha256(b"stage-a-keychain-negative-scan-sentinel").hexdigest().encode()
          roots = [
              workspace,
              runner_temp / "wuji-stage-a-build.log",
              runner_temp / "wuji-stage-a-tests.log",
              runner_temp / "wuji-stage-a-tests.xcresult",
              runner_temp / "wuji-stage-a-summary.json",
              runner_temp / "wuji-stage-a-tests.json",
              runner_temp / "wuji-stage-a-derived" / "Build" / "Products",
              pathlib.Path(os.environ["WUJI_STAGE_A_APP_DATA"]),
              pathlib.Path(os.environ["WUJI_STAGE_A_PROCESS_SNAPSHOT"]),
          ]

          def files(root):
              if root.is_file():
                  yield root
              elif root.is_dir():
                  for path in root.rglob("*"):
                      if path.is_file() and ".git" not in path.parts:
                          yield path

          checked = 0
          for root in roots:
              if not root.exists():
                  raise SystemExit(f"required secret scan surface missing: {root}")
              for path in files(root):
                  checked += 1
                  if secret in path.read_bytes():
                      raise SystemExit(f"exact Stage A secret found in retained surface: {path}")
          if checked == 0:
              raise SystemExit("Stage A secret scan inspected no files")
          print(f"STAGE_A_SECRET_SCAN_FILES={checked}")
          print("STAGE_A_EXACT_SECRET_SCAN=PASS")
          PY

      - name: Audit Stage A scope and protected historical boundaries
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 <<'PY'
          import pathlib
          import re
          import subprocess

          baseline = "d57ff0a1c0c5a3a749d35910c55dc6c495f657aa"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", baseline + "..HEAD"], text=True
          ).splitlines()
          allowed = re.compile(
              r"^(?:"
              r"Wuji\.xcodeproj/project\.pbxproj|"
              r"Wuji/(?:ContentView|DeepSeekProvider|DeepSeekSecureConfiguration|"
              r"DeepSeekSettingsView|StageAImportContracts|StageAViewModel|"
              r"StageAWorkspaceImporter|StageAWorkspaceStore|StageAZipArchive|"
              r"Wuji-Bridging-Header|WujiApp)\.swift|"
              r"Wuji/Wuji-Bridging-Header\.h|"
              r"WujiTests/WujiStageA(?:Import|SecureConfiguration)Tests\.swift|"
              r"Executor/WujiStageAZipBridge\.[ch]|"
              r"Executor/StageAMinizipConfig/mz_config\.h|"
              r"Scripts/(?:build-stage-a-zip|verify-minizip-lock)\.sh|"
              r"ThirdParty/minizip-ng/.*|"
              r"\.github/workflows/stage-a-production-entry\.yml"
              r")$"
          )
          unexpected = [path for path in changed if not allowed.fullmatch(path)]
          if unexpected:
              raise SystemExit("Stage A scope escaped: " + ", ".join(unexpected))

          secure = pathlib.Path("Wuji/DeepSeekSecureConfiguration.swift").read_text(encoding="utf-8")
          forbidden = ["ProcessInfo.processInfo.environment", "CommandLine.arguments", "print(", "NSLog("]
          found = [token for token in forbidden if token in secure]
          if found:
              raise SystemExit("secure configuration contains forbidden surface: " + ", ".join(found))
          print("STAGE_A_SCOPE_AUDIT=PASS")
          PY

  raw-log-audit:
    name: Exact Stage A raw-log and artifact audit
    if: always()
    needs: stage-a-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the completed Stage A validation job raw log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/stage-a-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$jobs_json"
          job_id="$(python3 - "$jobs_json" <<'PY'
          import json
          import sys
          jobs = json.load(open(sys.argv[1], encoding="utf-8"))["jobs"]
          matches = [
              job["id"] for job in jobs
              if job["name"].endswith("Apple build, Files import, ZIP policy, and Keychain tests")
          ]
          if len(matches) != 1:
              raise SystemExit("Stage A validation job identity is not unique")
          print(matches[0])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
            > "$RUNNER_TEMP/stage-a-validation-job.log"

      - name: Scan raw log for exact secret and bounded success markers
        shell: bash
        env:
          WUJI_STAGE_A_MAIN_RESULT: ${{ needs.stage-a-validation.result }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - "$RUNNER_TEMP/stage-a-validation-job.log" <<'PY'
          import hashlib
          import os
          import pathlib
          import sys

          log = pathlib.Path(sys.argv[1]).read_bytes()
          secret = hashlib.sha256(b"stage-a-keychain-negative-scan-sentinel").hexdigest().encode()
          if secret in log:
              raise SystemExit("exact Stage A secret found in validation raw log")
          if os.environ["WUJI_STAGE_A_MAIN_RESULT"] == "success":
              markers = [
                  b"STAGE_A_MINIZIP_SOURCE_LOCK=PASS",
                  b"Built fixed Stage A minizip closure",
                  b"** BUILD SUCCEEDED **",
                  b"** TEST SUCCEEDED **",
                  b"STAGE_A_XCRESULT_AUDIT=PASS",
                  b"STAGE_A_EXACT_SECRET_SCAN=PASS",
                  b"STAGE_A_SCOPE_AUDIT=PASS",
              ]
              missing = [marker.decode() for marker in markers if marker not in log]
              if missing:
                  raise SystemExit("required Stage A evidence marker missing: " + ", ".join(missing))
          print("STAGE_A_RAW_LOG_SECRET_SCAN=PASS")
          PY

      - name: Confirm this run published no artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')" = "0"
          echo 'STAGE_A_ARTIFACT_COUNT=0'
