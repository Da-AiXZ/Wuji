name: S3 Read-Only Agent

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  s3-validation:
    name: Apple build, S3 tests, real iSH, and real loop
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate without recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fail closed unless all Provider secrets are configured
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$DEEPSEEK_BASE_URL"
          test -n "$DEEPSEEK_MODEL"
          test -n "$DEEPSEEK_API_KEY"
          echo 'S3_SECRET_PREFLIGHT=PASS'

      - name: Verify exact head and initialize approved source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git submodule update --init ThirdParty/ish
          git -C ThirdParty/ish submodule update --init deps/libarchive
          Scripts/verify-source-lock.sh
          test "$(git rev-parse bb07580a8c7b799f6a1422da615d1ba93f9789b8^{tree})" = "18d8127a16172ee99e2c052ff5815130abc058cc"

      - name: Install fixed-source build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify rootfs before any use
        shell: bash
        run: Scripts/fetch-rootfs.sh

      - name: Build fixed iSH static closure
        shell: bash
        run: Scripts/build-ish.sh "$RUNNER_TEMP/wuji-ish"

      - name: Verify Apple toolchain
        shell: bash
        run: xcodebuild -version

      - name: Build exact-head unsigned Wuji app without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s3-derived" \
            clean build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s3-build.log"

      - name: Select and boot an ARM64 iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          simulator_id="$({ xcrun simctl list devices available -j; } | /usr/bin/python3 -c 'import json, sys; groups = json.load(sys.stdin)["devices"]; devices = [device for group in groups.values() for device in group if device.get("isAvailable") and "iPad" in device.get("name", "")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run S2 and S3 mock and boundary tests without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s3-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-s3-boundary-tests.xcresult" \
            -only-testing:"WujiTests/WujiProviderTests" \
            -only-testing:"WujiTests/WujiS3AgentTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s3-boundary-tests.log"

      - name: Run typed list search read through real iSH without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s3-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-s3-ish-tests.xcresult" \
            -only-testing:"WujiTests/WujiS3ISHIntegrationTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s3-ish-tests.log"

      - name: Install the already-built exact-head app without secrets
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/wuji-s3-derived/Build/Products/Debug-iphonesimulator/Wuji.app"
          test -d "$app"
          test -d "$app/S3Fixture"
          test -f "$app/rootfs.tar.gz"
          xcrun simctl uninstall "${{ steps.simulator.outputs.id }}" com.daaixz.wuji >/dev/null 2>&1 || true
          xcrun simctl install "${{ steps.simulator.outputs.id }}" "$app"

      - name: Run one real DeepSeek loop through the installed app
        id: real_loop
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_S3_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          set +x
          simulator_id="$WUJI_S3_SIMULATOR_ID"
          data_container="$(xcrun simctl get_app_container "$simulator_id" com.daaixz.wuji data)"
          summary_file="$data_container/Documents/wuji-s3-summary.json"
          rm -f "$summary_file"

          export SIMCTL_CHILD_WUJI_S3_PROBE_MODE=1
          export SIMCTL_CHILD_DEEPSEEK_BASE_URL="$DEEPSEEK_BASE_URL"
          export SIMCTL_CHILD_DEEPSEEK_MODEL="$DEEPSEEK_MODEL"
          export SIMCTL_CHILD_DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
          xcrun simctl launch --terminate-running-process \
            "$simulator_id" com.daaixz.wuji \
            > "$RUNNER_TEMP/wuji-s3-launch.log" 2>&1
          unset SIMCTL_CHILD_WUJI_S3_PROBE_MODE
          unset SIMCTL_CHILD_DEEPSEEK_BASE_URL
          unset SIMCTL_CHILD_DEEPSEEK_MODEL
          unset SIMCTL_CHILD_DEEPSEEK_API_KEY

          for _ in $(seq 1 300); do
            [[ -f "$summary_file" ]] && break
            sleep 2
          done
          xcrun simctl terminate "$simulator_id" com.daaixz.wuji >/dev/null 2>&1 || true
          test -f "$summary_file"

          export WUJI_S3_DATA_CONTAINER="$data_container"
          export WUJI_S3_SUMMARY_FILE="$summary_file"
          /usr/bin/python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if not secret:
              raise SystemExit("secret unavailable to scanner")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          data_container = pathlib.Path(os.environ["WUJI_S3_DATA_CONTAINER"])
          roots = [
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-build.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-boundary-tests.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-ish-tests.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-boundary-tests.xcresult",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-ish-tests.xcresult",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-derived" / "Build" / "Products" / "Debug-iphonesimulator" / "Wuji.app",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s3-launch.log",
              data_container,
          ]
          tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=workspace).split(b"\0")
          paths = [workspace / raw.decode() for raw in tracked if raw]
          for root in roots:
              if root.is_dir():
                  paths.extend(path for path in root.rglob("*") if path.is_file())
              elif root.is_file():
                  paths.append(root)

          def contains(path, needle):
              overlap = max(0, len(needle) - 1)
              tail = b""
              try:
                  with path.open("rb") as handle:
                      while True:
                          chunk = handle.read(1024 * 1024)
                          if not chunk:
                              return False
                          block = tail + chunk
                          if needle in block:
                              return True
                          tail = block[-overlap:] if overlap else b""
              except (OSError, PermissionError):
                  return False

          if any(contains(path, secret) for path in paths):
              raise SystemExit("secret found in S3 evidence surface")

          summary_path = pathlib.Path(os.environ["WUJI_S3_SUMMARY_FILE"])
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          expected_summary_keys = {
              "task_id", "result_category", "relative_path", "value",
              "provider_request_count", "tool_execution_count", "observation_sha256"
          }
          if set(summary) != expected_summary_keys:
              raise SystemExit("unexpected S3 summary shape")
          if summary["result_category"] != "completed":
              raise SystemExit("real S3 loop did not complete")
          if summary["relative_path"] != "records/target.txt":
              raise SystemExit("unexpected normalized target path")
          if summary["value"] != "read-only-loop-pass":
              raise SystemExit("unexpected target value")
          if not (1 <= summary["provider_request_count"] <= 8):
              raise SystemExit("provider request count outside cap")
          if not (3 <= summary["tool_execution_count"] <= 6):
              raise SystemExit("tool execution count outside cap")
          if not re.fullmatch(r"[0-9a-f]{64}", summary["observation_sha256"]):
              raise SystemExit("invalid observation hash")

          evidence_dirs = list((data_container / "Library" / "Application Support").glob("WujiS3Evidence-*"))
          if len(evidence_dirs) != 1:
              raise SystemExit("S3 evidence directory identity is not unique")
          evidence_dir = evidence_dirs[0]
          attempts = [json.loads(line) for line in (evidence_dir / "s3-attempts.jsonl").read_text(encoding="utf-8").splitlines()]
          provider_attempts = [json.loads(line) for line in (evidence_dir / "provider-attempts.jsonl").read_text(encoding="utf-8").splitlines()]

          if any("WUJI_S3_TARGET" in json.dumps(item) or "records/target.txt" in json.dumps(item) for item in attempts + provider_attempts):
              raise SystemExit("raw prompt, arguments, path, or observation persisted")
          operations = {}
          for item in attempts:
              operations.setdefault(item["operationID"], []).append(item)
          if any([entry["phase"] for entry in records] != ["intent_recorded", "succeeded"] for records in operations.values()):
              raise SystemExit("intent/terminal ordering invalid")
          if any(len({entry["attemptID"] for entry in records}) != 1 for records in operations.values()):
              raise SystemExit("attempt identity changed within operation")
          if len({records[0]["attemptID"] for records in operations.values()}) != len(operations):
              raise SystemExit("attempt identities are not unique")

          provider_ops = [records for records in operations.values() if records[0]["ioKind"] == "provider"]
          executor_ops = [records for records in operations.values() if records[0]["ioKind"] == "executor"]
          if len(provider_ops) != summary["provider_request_count"]:
              raise SystemExit("provider intent count mismatch")
          if len(executor_ops) != summary["tool_execution_count"]:
              raise SystemExit("executor intent count mismatch")
          tool_sequence = [records[0]["toolName"] for records in executor_ops]
          for required in ["list", "search", "read"]:
              if required not in tool_sequence:
                  raise SystemExit("required real tool observation missing")
          if not (tool_sequence.index("list") < tool_sequence.index("search") < tool_sequence.index("read")):
              raise SystemExit("required tool observation order invalid")

          if len(provider_attempts) != 2 * summary["provider_request_count"]:
              raise SystemExit("provider durable attempt count mismatch")
          provider_groups = {}
          for item in provider_attempts:
              provider_groups.setdefault(item["attemptID"], []).append(item)
          if any([item["phase"] for item in records] != ["intent_recorded", "succeeded"] for records in provider_groups.values()):
              raise SystemExit("provider durable ordering invalid")
          categories = [records[-1]["resultCategory"] for records in provider_groups.values()]
          if "tool_call" not in categories or categories[-1] != "finish":
              raise SystemExit("provider structured exchange evidence incomplete")

          bounded = {
              **summary,
              "tool_sequence": tool_sequence,
          }
          print("S3_REAL_LOOP_SUMMARY=" + json.dumps(bounded, sort_keys=True, separators=(",", ":")))
          print("S3_DURABLE_INTENT_AUDIT=PASS")
          print("S3_EVIDENCE_SECRET_SCAN=PASS")
          PY

      - name: Confirm S3 boundary and publication are absent
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e Wuji.ipa
          test ! -d Payload
          test "$(grep -Rho 'WUJI_S3_TARGET=read-only-loop-pass' Wuji/S3Fixture | wc -l | tr -d ' ')" = "1"
          /usr/bin/python3 <<'PY'
          import pathlib

          source = pathlib.Path("Executor/WujiISHAdapter.c").read_text(encoding="utf-8")
          start = source.index("WujiISHRunResult *wuji_ish_run_read_only")
          body = source[start:]
          for forbidden in ["/bin/sh", '"-c"', "/bin/curl", "/bin/wget", "/bin/rm", "/bin/mv", "/bin/cp"]:
              if forbidden in body:
                  raise SystemExit("forbidden command capability in S3 executor path")
          for required in ["/bin/ls", "/bin/grep", "/bin/cat"]:
              if required not in body:
                  raise SystemExit("required typed executable missing")
          PY
          if git diff --name-only bb07580a8c7b799f6a1422da615d1ba93f9789b8..HEAD | grep -E '^(ThirdParty/ish|Wuji/ISHExecutor.swift|Wuji/ExecutorContracts.swift|WujiTests/WujiISHGuestIntegrationTests.swift|WujiTests/WujiExecutorContractTests.swift|Scripts/build-ish.sh|Scripts/fetch-rootfs.sh|Scripts/verify-source-lock.sh)$'; then
            echo '::error::Protected S1 or fixed-source boundary changed'
            exit 1
          fi
          echo 'S3_FORBIDDEN_CAPABILITY_SCAN=PASS'

  raw-log-audit:
    name: Exact secret scan of S3 raw log
    if: always()
    needs: s3-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the completed S3 validation job raw log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/s3-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$jobs_json"
          job_id="$(python3 - "$jobs_json" <<'PY'
          import json
          import sys
          jobs = json.load(open(sys.argv[1], encoding="utf-8"))["jobs"]
          matches = [job["id"] for job in jobs if job["name"] == "Apple build, S3 tests, real iSH, and real loop"]
          if len(matches) != 1:
              raise SystemExit("S3 validation job identity is not unique")
          print(matches[0])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/s3-validation-job.log"

      - name: Scan raw log for exact secrets and success markers
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_S3_MAIN_RESULT: ${{ needs.s3-validation.result }}
        run: |
          set -euo pipefail
          set +x
          export WUJI_S3_RAW_LOG="$RUNNER_TEMP/s3-validation-job.log"
          /usr/bin/python3 <<'PY'
          import os
          import pathlib

          log = pathlib.Path(os.environ["WUJI_S3_RAW_LOG"]).read_bytes()
          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if not secret:
              raise SystemExit("secret unavailable to raw-log scanner")
          if secret in log:
              raise SystemExit("exact secret found in S3 validation raw log")
          if os.environ["WUJI_S3_MAIN_RESULT"] == "success":
              for marker in [
                  b"** BUILD SUCCEEDED **",
                  b"** TEST SUCCEEDED **",
                  b"S3_REAL_LOOP_SUMMARY=",
                  b'"result_category":"completed"',
                  b"S3_DURABLE_INTENT_AUDIT=PASS",
                  b"S3_EVIDENCE_SECRET_SCAN=PASS",
                  b"S3_FORBIDDEN_CAPABILITY_SCAN=PASS",
              ]:
                  if marker not in log:
                      raise SystemExit("required bounded S3 evidence marker missing")
          PY
          echo 'S3_RAW_LOG_SECRET_SCAN=PASS'

      - name: Confirm this run published no artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')" = "0"
          echo 'S3_ARTIFACT_COUNT=0'
