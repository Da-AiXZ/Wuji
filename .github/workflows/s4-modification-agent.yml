name: S4 Modification Agent

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  s4-validation:
    name: Apple build, S4 tests, real iSH, and real loop
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out exact candidate without recursive submodules
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Fail closed unless all Provider secrets are configured
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          set +x
          test -n "$DEEPSEEK_BASE_URL"
          test -n "$DEEPSEEK_MODEL"
          test -n "$DEEPSEEK_API_KEY"
          echo 'S4_SECRET_PREFLIGHT=PASS'

      - name: Verify exact head and initialize approved source only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git submodule update --init ThirdParty/ish
          git -C ThirdParty/ish submodule update --init deps/libarchive
          Scripts/verify-source-lock.sh
          test "$(git rev-parse bb07580a8c7b799f6a1422da615d1ba93f9789b8^{tree})" = "18d8127a16172ee99e2c052ff5815130abc058cc"
          test "$(git rev-parse 088cdbfa16b50195ff34855231021da2a67f3139^{tree})" = "db51b3d65ad2446453cecb1af395c7485104d51c"

      - name: Install fixed-source build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake meson ninja llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify rootfs before any use
        shell: bash
        run: Scripts/fetch-rootfs.sh

      - name: Build fixed iSH static closure
        shell: bash
        run: Scripts/build-ish.sh "$RUNNER_TEMP/wuji-ish"

      - name: Verify Apple toolchain
        shell: bash
        run: xcodebuild -version

      - name: Build exact-head unsigned Wuji app without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s4-derived" \
            clean build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s4-build.log"

      - name: Select and boot an ARM64 iPad simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          simulator_id="$({ xcrun simctl list devices available -j; } | /usr/bin/python3 -c 'import json, sys; groups = json.load(sys.stdin)["devices"]; devices = [device for group in groups.values() for device in group if device.get("isAvailable") and "iPad" in device.get("name", "")]; print(devices[0]["udid"] if devices else "")')"
          test -n "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Run Provider, S3, and S4 mock and boundary tests without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s4-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-s4-boundary-tests.xcresult" \
            -only-testing:"WujiTests/WujiProviderTests" \
            -only-testing:"WujiTests/WujiS3AgentTests" \
            -only-testing:"WujiTests/WujiS4ContractsTests" \
            -only-testing:"WujiTests/WujiS4ExecutorContractTests" \
            -only-testing:"WujiTests/WujiS4AgentTests" \
            -only-testing:"WujiTests/WujiS4ApprovalViewTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s4-boundary-tests.log"

      - name: Run typed read edit and fixed verify through real iSH without secrets
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          WUJI_ISH_BUILD_DIR="$RUNNER_TEMP/wuji-ish" xcodebuild \
            -project Wuji.xcodeproj \
            -scheme Wuji \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -derivedDataPath "$RUNNER_TEMP/wuji-s4-derived" \
            -resultBundlePath "$RUNNER_TEMP/wuji-s4-ish-tests.xcresult" \
            -only-testing:"WujiTests/WujiS3ISHIntegrationTests" \
            -only-testing:"WujiTests/WujiS4ISHIntegrationTests" \
            test \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$RUNNER_TEMP/wuji-s4-ish-tests.log"

      - name: Install the already-built exact-head app without secrets
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/wuji-s4-derived/Build/Products/Debug-iphonesimulator/Wuji.app"
          test -d "$app"
          test -d "$app/S3Fixture"
          test -d "$app/S4Fixture"
          test -f "$app/rootfs.tar.gz"
          xcrun simctl uninstall "${{ steps.simulator.outputs.id }}" com.daaixz.wuji >/dev/null 2>&1 || true
          xcrun simctl install "${{ steps.simulator.outputs.id }}" "$app"

      - name: Run one real DeepSeek loop through the installed app
        id: real_loop
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_S4_SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -euo pipefail
          set +x
          simulator_id="$WUJI_S4_SIMULATOR_ID"
          data_container="$(xcrun simctl get_app_container "$simulator_id" com.daaixz.wuji data)"
          summary_file="$data_container/Documents/wuji-s4-summary.json"
          rm -f "$summary_file"

          export SIMCTL_CHILD_WUJI_S4_PROBE_MODE=1
          export SIMCTL_CHILD_WUJI_S4_TASK_PACKAGE_ID=wuji-s4-status-verified-v1
          export SIMCTL_CHILD_DEEPSEEK_BASE_URL="$DEEPSEEK_BASE_URL"
          export SIMCTL_CHILD_DEEPSEEK_MODEL="$DEEPSEEK_MODEL"
          export SIMCTL_CHILD_DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY"
          xcrun simctl launch --terminate-running-process \
            "$simulator_id" com.daaixz.wuji \
            > "$RUNNER_TEMP/wuji-s4-launch.log" 2>&1
          unset SIMCTL_CHILD_WUJI_S4_PROBE_MODE
          unset SIMCTL_CHILD_WUJI_S4_TASK_PACKAGE_ID
          unset SIMCTL_CHILD_DEEPSEEK_BASE_URL
          unset SIMCTL_CHILD_DEEPSEEK_MODEL
          unset SIMCTL_CHILD_DEEPSEEK_API_KEY

          for _ in $(seq 1 300); do
            [[ -f "$summary_file" ]] && break
            sleep 2
          done
          xcrun simctl terminate "$simulator_id" com.daaixz.wuji >/dev/null 2>&1 || true
          test -f "$summary_file"

          export WUJI_S4_DATA_CONTAINER="$data_container"
          export WUJI_S4_SUMMARY_FILE="$summary_file"
          /usr/bin/python3 <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess

          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if not secret:
              raise SystemExit("secret unavailable to scanner")

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          data_container = pathlib.Path(os.environ["WUJI_S4_DATA_CONTAINER"])
          roots = [
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-build.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-boundary-tests.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-ish-tests.log",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-boundary-tests.xcresult",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-ish-tests.xcresult",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-derived" / "Build" / "Products" / "Debug-iphonesimulator" / "Wuji.app",
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "wuji-s4-launch.log",
              data_container,
          ]
          tracked = subprocess.check_output(["git", "ls-files", "-z"], cwd=workspace).split(b"\0")
          paths = [workspace / raw.decode() for raw in tracked if raw]
          for root in roots:
              if root.is_dir():
                  paths.extend(path for path in root.rglob("*") if path.is_file())
              elif root.is_file():
                  paths.append(root)

          def contains(path, needle):
              overlap = max(0, len(needle) - 1)
              tail = b""
              try:
                  with path.open("rb") as handle:
                      while True:
                          chunk = handle.read(1024 * 1024)
                          if not chunk:
                              return False
                          block = tail + chunk
                          if needle in block:
                              return True
                          tail = block[-overlap:] if overlap else b""
              except (OSError, PermissionError):
                  return False

          if any(contains(path, secret) for path in paths):
              raise SystemExit("secret found in S4 evidence surface")

          summary_path = pathlib.Path(os.environ["WUJI_S4_SUMMARY_FILE"])
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          expected_summary_keys = {
              "result_category", "provider_request_count", "executor_call_count",
              "tool_sequence", "approval_category", "authorized_path",
              "before_sha256", "after_sha256", "diff_sha256", "write_category",
              "verify_category", "write_root_exit_observed", "write_stdout_eof_observed",
              "write_stderr_eof_observed", "write_truncated", "verify_root_exit_observed",
              "verify_stdout_eof_observed", "verify_stderr_eof_observed",
              "verify_truncated", "completion_category",
              "policy_rejection_reason", "policy_call_index",
          }
          if set(summary) != expected_summary_keys:
              raise SystemExit("unexpected S4 summary shape")

          evidence_dirs = list((data_container / "Library" / "Application Support").glob("WujiS4Evidence-*"))
          if len(evidence_dirs) != 1:
              raise SystemExit("S4 evidence directory identity is not unique")
          evidence_dir = evidence_dirs[0]

          def read_jsonl(name):
              path = evidence_dir / name
              if not path.is_file():
                  return []
              return [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines()]

          attempts = read_jsonl("s4-attempts.jsonl")
          approvals = read_jsonl("s4-approvals.jsonl")
          provider_attempts = read_jsonl("provider-attempts.jsonl")

          if summary["result_category"] != "completed":
              allowed_policy_reasons = {
                  "batch_count", "side_effect_isolation", "tool_call_id", "unknown_tool",
                  "invalid_arguments", "path_rejected", "path_unavailable", "symlink_escape",
                  "query_rejected", "stale_phase", "verification_profile",
              }
              reason = summary["policy_rejection_reason"]
              index = summary["policy_call_index"]
              if summary["result_category"] == "policy_rejected":
                  if reason not in allowed_policy_reasons:
                      raise SystemExit("unexpected policy rejection reason")
                  if isinstance(index, bool) or not isinstance(index, int) or not (-1 <= index < 3):
                      raise SystemExit("policy rejection index outside cap")
              elif reason != "" or index != -1:
                  raise SystemExit("policy diagnostic outside policy rejection")
              bounded_failure = {
                  "result_category": summary["result_category"],
                  "provider_intent_count": sum(
                      item.get("ioKind") == "provider" and item.get("phase") == "intent_recorded"
                      for item in attempts
                  ),
                  "executor_intent_count": sum(
                      item.get("ioKind") in {"read_executor", "write_executor", "verify_executor"}
                      and item.get("phase") == "intent_recorded"
                      for item in attempts
                  ),
                  "s4_terminal_categories": [
                      item.get("resultCategory")
                      for item in attempts
                      if item.get("phase") != "intent_recorded"
                  ],
                  "provider_terminal_categories": [
                      item.get("resultCategory")
                      for item in provider_attempts
                      if item.get("phase") != "intent_recorded"
                  ],
                  "approval_phases": [item.get("phase") for item in approvals],
                  "policy_rejection_reason": reason,
                  "policy_call_index": index,
                  "tool_sequence": [
                      item.get("toolName")
                      for item in attempts
                      if item.get("phase") == "succeeded"
                      and item.get("ioKind") in {"read_executor", "write_executor", "verify_executor"}
                  ],
              }
              print("S4_REAL_LOOP_FAILURE_SUMMARY=" + json.dumps(
                  bounded_failure,
                  sort_keys=True,
                  separators=(",", ":"),
              ))
              raise SystemExit("real S4 loop did not complete")
          if summary["authorized_path"] != "records/draft.txt":
              raise SystemExit("unexpected authorized path")
          if summary["approval_category"] != "validation_grant":
              raise SystemExit("explicit validation approval missing")
          if summary["completion_category"] != "code_owned_completed":
              raise SystemExit("code-owned completion missing")
          if summary["policy_rejection_reason"] != "" or summary["policy_call_index"] != -1:
              raise SystemExit("policy diagnostic present on completed summary")
          if not (1 <= summary["provider_request_count"] <= 10):
              raise SystemExit("provider request count outside cap")
          if not (5 <= summary["executor_call_count"] <= 10):
              raise SystemExit("executor call count outside cap")
          for key in ["before_sha256", "after_sha256", "diff_sha256"]:
              if not re.fullmatch(r"[0-9a-f]{64}", summary[key]):
                  raise SystemExit("invalid summary hash")
          if summary["write_category"] != "write_applied" or summary["verify_category"] != "verify_passed":
              raise SystemExit("write or verify category mismatch")
          for key in [
              "write_root_exit_observed", "write_stdout_eof_observed", "write_stderr_eof_observed",
              "verify_root_exit_observed", "verify_stdout_eof_observed", "verify_stderr_eof_observed",
          ]:
              if summary[key] is not True:
                  raise SystemExit("executor completion barrier missing")
          if summary["write_truncated"] or summary["verify_truncated"]:
              raise SystemExit("executor observation truncated")

          evidence_text = json.dumps(attempts + approvals + provider_attempts, sort_keys=True)
          for forbidden in ["TITLE=Wuji", "STATUS=pending", "STATUS=verified", "CONTEXT=preserve"]:
              if forbidden in evidence_text:
                  raise SystemExit("raw workspace content persisted in evidence")
          operations = {}
          for item in attempts:
              operations.setdefault(item["operationID"], []).append(item)
          if any([entry["phase"] for entry in records] != ["intent_recorded", "succeeded"] for records in operations.values()):
              raise SystemExit("intent/terminal ordering invalid")
          if any(len({entry["attemptID"] for entry in records}) != 1 for records in operations.values()):
              raise SystemExit("attempt identity changed within operation")
          if len({records[0]["attemptID"] for records in operations.values()}) != len(operations):
              raise SystemExit("attempt identities are not unique")

          provider_ops = [records for records in operations.values() if records[0]["ioKind"] == "provider"]
          executor_ops = [records for records in operations.values() if records[0]["ioKind"] in {"read_executor", "write_executor", "verify_executor"}]
          if len(provider_ops) != summary["provider_request_count"]:
              raise SystemExit("provider intent count mismatch")
          if len(executor_ops) != summary["executor_call_count"]:
              raise SystemExit("executor intent count mismatch")
          tool_sequence = [records[0]["toolName"] for records in executor_ops]
          for required in ["list", "search", "read"]:
              if required not in tool_sequence:
                  raise SystemExit("required real tool observation missing")
          if not (tool_sequence.index("list") < tool_sequence.index("search") < tool_sequence.index("read")):
              raise SystemExit("required tool observation order invalid")
          if tool_sequence.count("edit") != 1 or tool_sequence.count("verify") != 1:
              raise SystemExit("side-effect tool count mismatch")
          if tool_sequence.index("edit") > tool_sequence.index("verify"):
              raise SystemExit("verify executed before edit")
          if tool_sequence != summary["tool_sequence"]:
              raise SystemExit("summary tool sequence mismatch")
          if [item.get("phase") for item in approvals] != ["pending", "granted"]:
              raise SystemExit("approval durable ordering invalid")

          if len(provider_attempts) != 2 * summary["provider_request_count"]:
              raise SystemExit("provider durable attempt count mismatch")
          provider_groups = {}
          for item in provider_attempts:
              provider_groups.setdefault(item["attemptID"], []).append(item)
          if any([item["phase"] for item in records] != ["intent_recorded", "succeeded"] for records in provider_groups.values()):
              raise SystemExit("provider durable ordering invalid")
          categories = [records[-1]["resultCategory"] for records in provider_groups.values()]
          if "tool_call" not in categories or categories[-1] != "finish":
              raise SystemExit("provider structured exchange evidence incomplete")

          print("S4_REAL_LOOP_SUMMARY=" + json.dumps(summary, sort_keys=True, separators=(",", ":")))
          print("S4_DURABLE_INTENT_AUDIT=PASS")
          print("S4_EVIDENCE_SECRET_SCAN=PASS")
          PY

      - name: Confirm S4 capability, fixture, and publication boundaries
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e Wuji.ipa
          test ! -d Payload
          /usr/bin/python3 <<'PY'
          import hashlib
          import pathlib

          source = pathlib.Path("Executor/WujiISHAdapter.c").read_text(encoding="utf-8")
          start = source.index("static const char s4_edit_script")
          body = source[start:source.index("WujiISHCancelDelivery wuji_ish_request_cancel")]
          for forbidden in ["/bin/curl", "/bin/wget", "/usr/bin/git", "apk add", "apt-get"]:
              if forbidden in body:
                  raise SystemExit("forbidden command capability in S4 executor path")
          for required in [
              "static const char s4_edit_script", "static const char s4_verify_script",
              '"/bin/sh"', '"-c"', '"records/draft.txt"', '"STATUS=pending"',
              '"STATUS=verified"', '"s4_status_verified"', "sha256sum", "mv -f --",
              "WUJI_S4_EDIT_OK", "WUJI_S4_VERIFY_OK",
          ]:
              if required not in body:
                  raise SystemExit("required fixed S4 boundary missing")
          swift = "\n".join(
              path.read_text(encoding="utf-8")
              for path in pathlib.Path("Wuji").glob("*S4*.swift")
          )
          for forbidden in ["command: String", "URLSession.shared", "Process(", "NSTask", "package install"]:
              if forbidden in swift:
                  raise SystemExit("forbidden generic capability in S4 Swift")

          draft = pathlib.Path("Wuji/S4Fixture/records/draft.txt").read_bytes()
          context = pathlib.Path("Wuji/S4Fixture/records/context.txt").read_bytes()
          if draft != b"TITLE=Wuji S4 bounded edit fixture\nSTATUS=pending\nCONTEXT=preserve-this-line-byte-for-byte\n":
              raise SystemExit("S4 draft fixture changed")
          if context != b"WUJI_S4_CONTEXT=must-remain-unchanged\n":
              raise SystemExit("S4 context fixture changed")
          if draft.count(b"STATUS=pending") != 1:
              raise SystemExit("S4 pending token count changed")
          PY
          if git diff --name-only 088cdbfa16b50195ff34855231021da2a67f3139..HEAD | grep -E '^(ThirdParty/ish|Wuji/ISHExecutor.swift|Wuji/ExecutorContracts.swift|Wuji/ISHReadOnlyExecutor.swift|Wuji/S3AttemptStore.swift|Wuji/S3ReadOnlyAgent.swift|Wuji/S3ReadOnlyTools.swift|Wuji/S3Fixture|WujiTests/WujiISHGuestIntegrationTests.swift|WujiTests/WujiExecutorContractTests.swift|WujiTests/WujiS3|Scripts/build-ish.sh|Scripts/fetch-rootfs.sh|Scripts/verify-source-lock.sh|\.github/workflows/s[0-3]-)'; then
            echo '::error::Protected S1 or fixed-source boundary changed'
            exit 1
          fi
          echo 'S4_FORBIDDEN_CAPABILITY_SCAN=PASS'

  raw-log-audit:
    name: Exact secret scan of S4 raw log
    if: always()
    needs: s4-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download the completed S4 validation job raw log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/s4-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > "$jobs_json"
          job_id="$(python3 - "$jobs_json" <<'PY'
          import json
          import sys
          jobs = json.load(open(sys.argv[1], encoding="utf-8"))["jobs"]
          matches = [
              job["id"]
              for job in jobs
              if job["name"].endswith("Apple build, S4 tests, real iSH, and real loop")
          ]
          if len(matches) != 1:
              raise SystemExit("S4 validation job identity is not unique")
          print(matches[0])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/s4-validation-job.log"

      - name: Scan raw log for exact secrets and success markers
        shell: bash
        env:
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          WUJI_S4_MAIN_RESULT: ${{ needs.s4-validation.result }}
        run: |
          set -euo pipefail
          set +x
          export WUJI_S4_RAW_LOG="$RUNNER_TEMP/s4-validation-job.log"
          /usr/bin/python3 <<'PY'
          import os
          import pathlib

          log = pathlib.Path(os.environ["WUJI_S4_RAW_LOG"]).read_bytes()
          secret = os.environ["DEEPSEEK_API_KEY"].encode()
          if not secret:
              raise SystemExit("secret unavailable to raw-log scanner")
          if secret in log:
              raise SystemExit("exact secret found in S4 validation raw log")
          if os.environ["WUJI_S4_MAIN_RESULT"] == "success":
              for marker in [
                  b"** BUILD SUCCEEDED **",
                  b"** TEST SUCCEEDED **",
                  b"S4_REAL_LOOP_SUMMARY=",
                  b'"result_category":"completed"',
                  b"S4_DURABLE_INTENT_AUDIT=PASS",
                  b"S4_EVIDENCE_SECRET_SCAN=PASS",
                  b"S4_FORBIDDEN_CAPABILITY_SCAN=PASS",
              ]:
                  if marker not in log:
                      raise SystemExit("required bounded S4 evidence marker missing")
          PY
          echo 'S4_RAW_LOG_SECRET_SCAN=PASS'

      - name: Confirm this run published no artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.total_count')" = "0"
          echo 'S4_ARTIFACT_COUNT=0'
